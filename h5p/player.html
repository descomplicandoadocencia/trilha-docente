<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H5P Player — Arquiteto da Cultura Digital</title>
<style>
  html,body{margin:0;padding:0;background:#0b1f22;font-family:sans-serif}
  #h5p-container{width:100%;max-width:960px;margin:0 auto}
  .h5p-iframe-wrapper{position:relative}
</style>
</head>
<body>
<div id="h5p-container"></div>
<script src="https://cdn.jsdelivr.net/npm/h5p-standalone@3.6.3/dist/main.bundle.js"></script>
<script>
  // Uso: h5p/player.html?dir=ilha1-interactive-video
  const params = new URLSearchParams(window.location.search);
  const dir = params.get('dir') || 'ilha1-interactive-video';
  const el = document.getElementById('h5p-container');
  const options = {
    h5pJsonPath: dir,
    frameJs: 'https://cdn.jsdelivr.net/npm/h5p-standalone@3.6.3/dist/frame.bundle.js',
    frameCss: 'https://cdn.jsdelivr.net/npm/h5p-standalone@3.6.3/dist/styles/h5p.css'
  };
  new H5PStandalone.H5P(el, options).catch(err => {
    el.innerHTML = '<p style="color:#fff;padding:20px">Erro ao carregar o pacote H5P: ' + err + '</p>';
  });
</script>
</body>
</html>
